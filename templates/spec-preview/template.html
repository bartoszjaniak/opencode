<!DOCTYPE html>
<!--
  Szablon podgladu specyfikacji (generyczny) - SHELL, design "Bauhaus technical".
  Przy generowaniu podgladu NIE edytuj tego pliku: skopiuj go do pliku docelowego, uzupelnij
  {{SPEC_NAME}} / {{SPEC_LEAD}} / {{SPEC_SOURCE}} i wklej sekcje w miejscu znacznika "SEKCJE".
  Gotowe snippety komponentow (karty, tabele, kod, SVG, wykresy): components.md obok tego pliku.
  WIDZET KOMENTARZY (#sc-widget, #sc-bubble, #sc-toast + sekcja "5. Komentarze" w skrypcie) jest czescia
  szablonu - nie usuwaj go i nie modyfikuj. Komentarze trafiaja do localStorage przegladarki.
  PODZIAL PLIKU: gorna czesc (do komentarza "KONIEC TRESCI") to tresc dokumentu - tam wpisuje sie sekcje.
  Ponizej "KONIEC TRESCI" lezy blok <style> i <script> z szablonu: nie edytuj tego bloku ani go nie czytaj.
-->
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{SPEC_NAME}}</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f0e8] text-[#1a1a1a] antialiased">
<header class="sticky top-0 z-50 bg-[#f5f0e8] border-b-2 border-[#1a1a1a] px-4 md:px-8 py-3.5 flex items-center gap-3">
  <div class="w-5 h-5 bg-[#e63b2e] border border-[#1a1a1a] shrink-0"></div>
  <span class="font-['Space_Grotesk'] font-bold text-sm md:text-lg tracking-tight uppercase truncate">{{SPEC_NAME}}</span>
</header>

<div class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 lg:border-x-2 border-[#1a1a1a]">
  <!-- Lewa kolumna: indeks dokumentu (budowany automatycznie z sekcji) -->
  <aside class="lg:col-span-3 border-b-2 lg:border-b-0 lg:border-r-2 border-[#1a1a1a] bg-[#eee9e0] p-6 lg:p-8 sticky lg:top-[57px] self-start lg:h-[calc(100vh-57px)] overflow-y-auto font-['Space_Grotesk']">
    <div class="flex items-center justify-between pb-3 border-b-2 border-[#1a1a1a] mb-5">
      <span class="text-xs font-bold tracking-widest uppercase font-mono">Indeks dokumentu</span>
      <div class="w-2.5 h-2.5 bg-[#0055ff]"></div>
    </div>
    <nav class="space-y-1 text-sm font-medium" id="toc-nav" aria-label="Indeks dokumentu"></nav>
  </aside>

  <!-- Prawa kolumna: dokument -->
  <main class="lg:col-span-9 p-6 md:p-10 lg:p-12 space-y-12 bg-[#f5f0e8]" id="spec-content">
    <section class="border-2 border-[#1a1a1a] bg-[#ffffff] p-6 md:p-8 shadow-[4px_4px_0px_#1a1a1a]">
      <h1 class="font-['Space_Grotesk'] text-2xl md:text-4xl font-bold tracking-tight mb-4 leading-tight">{{SPEC_NAME}}</h1>
      <p class="font-['Inter'] text-base md:text-lg leading-relaxed text-[#1a1a1a]/90 max-w-4xl">{{SPEC_LEAD}}</p>
    </section>

    <!-- SEKCJE: wklej tutaj sekcje dokumentu (jedna sekcja na kazdy naglowek H2 zrodla).
         KONTRAKT: <section id="slug" class="space-y-4"> + <h2 class="title text-xl md:text-2xl">TYTUL</h2> + tresc.
         Numer "01.", kolorowy kwadrat i linia pod naglowkiem generuja sie automatycznie, wiec w tytule NIE wpisuj numeru.

         SCIAGA (element zrodla -> komponent; pelne snippet'y: components.md):
           akapit, lista                 -> <p class="prose">, <ul class="prose">
           tabela                        -> <div class="table-wrap"><table class="tbl"> z td.k (nazwa), td.v (wartosc), td.n (notka)
           blok kodu                     -> <div class="codeblock"><div class="cb-head">plik + Kopiuj</div><pre><code id="kod-1">
           kroki, fazy                   -> <ol class="steps"><li class="step"><span class="n">01</span>...
           checklista "- [ ]"            -> <div class="checklist"><label><input class="check-item">...
           liczby, metryki               -> <div class="grid-3"><div class="card tight"> + <div class="metric">
           porownanie, progi, trendy     -> wykres SVG w <div class="figure">
           architektura, przeplyw        -> diagram SVG w <div class="figure">
           ryzyko, ostrzezenie           -> <div class="card danger">, uwaga -> <div class="card warn">
           status, priorytet, tag        -> <span class="chip k"> (k czarny, y zolty, b niebieski, r czerwony, n neutralny)
           tytul/etykieta w karcie       -> <div class="label"> lub <div class="label out">

         Zasady: zero zaokraglen, obramowania 2px, akcenty #ffcc00 / #0055ff / #e63b2e, tresc w .prose.

         WZOR SEKCJI do skopiowania:
         <section id="przyklad" class="space-y-4">
           <h2 class="title text-xl md:text-2xl">Tytul sekcji</h2>
           <p class="prose">Akapit z kodem <code class="ic">prog = 12</code>.</p>
           <div class="grid-2">
             <div class="card"><div class="label out">Etykieta</div><p class="prose">Tresc karty.</p></div>
             <div class="card danger"><div class="label">Ryzyko</div><p class="prose">Opis ryzyka.</p></div>
           </div>
           <div class="table-wrap"><table class="tbl">
             <thead><tr><th>Element</th><th>Wartosc</th></tr></thead>
             <tbody><tr><td class="k">wiersz</td><td class="v">12</td></tr></tbody>
           </table></div>
         </section> -->

    <footer class="border-2 border-[#1a1a1a] bg-[#ffffff] p-6 shadow-[4px_4px_0px_#1a1a1a] flex flex-wrap items-center justify-between gap-4 font-['Space_Grotesk']">
      <span class="font-mono text-xs uppercase text-[#1a1a1a]/70">{{SPEC_NAME}}</span>
      <a class="font-mono text-xs font-bold underline underline-offset-4 hover:bg-[#ffcc00]" href="{{SPEC_SOURCE}}">Źródło: {{SPEC_SOURCE}}</a>
    </footer>
  </main>
</div>

<!-- Komentarze: dymek edycyjny (pozycja wyliczana przy kliknieciu) -->
<div id="sc-bubble" hidden role="dialog" aria-label="Komentarz do elementu">
  <div class="sc-bubble-head">
    <span class="sc-bubble-title">Komentarz</span>
    <button id="sc-close" type="button" title="Zamknij (Esc)" aria-label="Zamknij">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <textarea id="sc-input" placeholder="Treść komentarza..." aria-label="Treść komentarza"></textarea>
  <div class="sc-bubble-actions">
    <button id="sc-delete" type="button" hidden title="Usuń ten komentarz" aria-label="Usuń komentarz">
      <span class="material-symbols-outlined">delete</span>
    </button>
    <span class="sc-hint">Enter = zapisz · Shift+Enter = nowa linia</span>
    <button id="sc-save" type="button" title="Zapisz komentarz (Enter)" aria-label="Zapisz komentarz">
      <span class="material-symbols-outlined">check</span>
    </button>
  </div>
</div>

<!-- Komentarze: indykatory istniejacych komentarzy (pozycje wyliczane w JS) -->
<div id="sc-markers"></div>

<!-- Komentarze: licznik (klik = kopiuj JSON do schowka) -->
<div id="sc-widget">
  <button id="sc-count" type="button" hidden></button>
</div>
<div id="sc-toast" role="status" aria-live="polite" hidden></div>

<!-- ================== KONIEC TRESCI ==================
     Powyzej konczy sie tresc dokumentu. Ponizszy blok stylow i skrypt pochodza w calosci
     z szablonu. NIE EDYTUJ i NIE CZYTAJ go przy generowaniu podgladu. ================== -->
<style>
  /* Paleta: krem #f5f0e8 | panel #eee9e0 | karta #ffffff | tusz #1a1a1a
     akcenty: żółty #ffcc00 | niebieski #0055ff | czerwony #e63b2e
     Zasady: brak zaokrągleń, obramowania 2px, twardy cień offsetowy (shadow-[4px_4px_0px_#1a1a1a]). */
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  ::selection { background: #ffcc00; color: #1a1a1a; }
  /* Style ponizej sa celowo w czystym CSS - elementy nawigacji naglowkow sekcji dokladane sa przez JS
     po starcie Tailwind JIT (dynamiczne klasy moga nie zostac skompilowane). */
  .sec-head { display: flex; align-items: center; gap: .75rem; border-bottom: 2px solid #1a1a1a; padding-bottom: .5rem; }
  .sec-dot { width: 1rem; height: 1rem; border: 1px solid #1a1a1a; flex: none; }
  .sec-num { font-family: "JetBrains Mono", monospace; font-weight: 700; margin-right: .5rem; }
  .toc-item { display: block; padding: .375rem .625rem; border-left: 2px solid transparent; color: rgba(26,26,26,.8); transition: all .15s; }
  .toc-item:hover { border-left-color: #1a1a1a; background: #f5f0e8; }
  .toc-item.is-active { border-left-color: #1a1a1a; background: #f5f0e8; color: #1a1a1a; font-weight: 700; }
  /* --- Warstwa komponentow ---
     Krotkie klasy zamiast dlugich list utility: ten sam wyglad, znacznie mniej kodu w sekcjach.
     W sekcjach uzywaj TYCH klas (snippet'y w components.md). */
  .card { border: 2px solid #1a1a1a; background: #ffffff; padding: 1.25rem; box-shadow: 4px 4px 0 #1a1a1a; }
  .card.tight { padding: 1rem; box-shadow: 3px 3px 0 #1a1a1a; }
  .card.ink { background: #1a1a1a; color: #ffffff; }
  .card.danger { background: #e63b2e; color: #ffffff; }
  .card.warn { background: #ffcc00; color: #1a1a1a; }
  .label { font-family: "JetBrains Mono", monospace; font-size: .6875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .label.out { color: rgba(26,26,26,.6); }
  .title { font-family: "Space_Grotesk", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: -.01em; }
  .prose { font-family: "Inter", sans-serif; font-size: .9375rem; line-height: 1.7; color: rgba(26,26,26,.92); }
  .prose strong { font-weight: 600; }
  code.ic { font-family: "JetBrains Mono", monospace; font-weight: 700; background: #eee9e0; border: 1px solid #1a1a1a; padding: 0 .25rem; }
  .grid-2 { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
  .grid-3 { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .chip { display: inline-block; padding: .125rem .5rem; font-family: "JetBrains Mono", monospace; font-size: .75rem; font-weight: 700; }
  .chip.k { background: #1a1a1a; color: #ffffff; }
  .chip.y { background: #ffcc00; color: #1a1a1a; border: 1px solid #1a1a1a; }
  .chip.b { background: #0055ff; color: #ffffff; }
  .chip.r { background: #e63b2e; color: #ffffff; }
  .chip.n { background: #eee9e0; color: #1a1a1a; border: 1px solid #1a1a1a; }
  .table-wrap { border: 2px solid #1a1a1a; background: #ffffff; overflow-x: auto; box-shadow: 4px 4px 0 #1a1a1a; }
  .tbl { width: 100%; border-collapse: collapse; font-family: "Inter", sans-serif; font-size: .8125rem; text-align: left; }
  .tbl thead th { background: #1a1a1a; color: #ffffff; font-family: "Space_Grotesk", sans-serif; font-weight: 700; text-transform: uppercase; font-size: .75rem; padding: .75rem; }
  .tbl tbody td { padding: .75rem; border-top: 2px solid #1a1a1a; vertical-align: top; }
  .tbl tbody tr:hover { background: #f5f0e8; }
  .tbl td.k { font-weight: 600; }
  .tbl td.v { font-family: "JetBrains Mono", monospace; font-weight: 700; color: #0055ff; }
  .tbl td.n { font-family: "JetBrains Mono", monospace; font-size: .75rem; color: rgba(26,26,26,.75); }
  .metric { font-family: "JetBrains Mono", monospace; font-size: 1.5rem; font-weight: 700; }
  .codeblock { border: 2px solid #1a1a1a; background: #1a1a1a; color: #ffffff; box-shadow: 4px 4px 0 #1a1a1a; }
  .cb-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .625rem 1rem; background: #262626; border-bottom: 2px solid #1a1a1a; font-family: "JetBrains Mono", monospace; font-size: .75rem; }
  .codeblock pre { margin: 0; padding: 1.25rem; overflow-x: auto; font-family: "JetBrains Mono", monospace; font-size: .8125rem; line-height: 1.6; color: #e2ddd4; }
  .figure { border: 2px solid #1a1a1a; background: #ffffff; padding: 1.25rem; box-shadow: 4px 4px 0 #1a1a1a; }
  .figure-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: .75rem; margin-bottom: 1rem; border-bottom: 2px solid #1a1a1a; font-family: "JetBrains Mono", monospace; font-size: .75rem; }
  .figure svg { width: 100%; height: auto; font-family: "JetBrains Mono", monospace; }
  .figure .legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .75rem; padding-top: .5rem; border-top: 1px solid #1a1a1a; font-family: "JetBrains Mono", monospace; font-size: .75rem; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1rem; }
  .step { display: flex; gap: 1rem; }
  .step .n { font-family: "JetBrains Mono", monospace; font-weight: 700; color: #0055ff; }
  .checklist { display: flex; flex-direction: column; gap: .75rem; font-family: "Inter", sans-serif; font-size: .875rem; }
  .checklist label { display: flex; gap: .75rem; align-items: flex-start; cursor: pointer; }
  .checklist .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: .75rem; color: rgba(26,26,26,.7); }
  .check-item { margin-top: .25rem; width: 1rem; height: 1rem; accent-color: #1a1a1a; }
  /* --- Komentarze: indykatory + dymek + licznik --- */
  #sc-widget { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 60; }
  #sc-widget button, #sc-bubble button, .sc-marker { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; border: 2px solid #1a1a1a; }
  #sc-widget .material-symbols-outlined, #sc-bubble .material-symbols-outlined, .sc-marker .material-symbols-outlined { line-height: 1; }
  #sc-count { height: 2.5rem; padding: 0 .75rem; gap: .375rem; background: #ffcc00; color: #1a1a1a; font-family: "JetBrains Mono", monospace; font-size: .875rem; font-weight: 700; box-shadow: 3px 3px 0 #1a1a1a; }
  #sc-count:hover { background: #f5f0e8; }
  #sc-count .material-symbols-outlined { font-size: 1.125rem; }
  [hidden] { display: none !important; }
  #sc-markers { position: absolute; top: 0; left: 0; width: 100%; height: 0; z-index: 55; pointer-events: none; }
  .sc-marker { position: absolute; width: 1.5rem; height: 1.5rem; background: #ffcc00; color: #1a1a1a; box-shadow: 2px 2px 0 #1a1a1a; pointer-events: auto; }
  .sc-marker:hover { background: #0055ff; color: #ffffff; }
  .sc-marker .material-symbols-outlined { font-size: .9375rem; }
  #sc-bubble { position: fixed; z-index: 65; width: min(24rem, calc(100vw - 2rem)); background: #ffffff; border: 2px solid #1a1a1a; box-shadow: 4px 4px 0 #1a1a1a; padding: .75rem; display: flex; flex-direction: column; gap: .625rem; }
  .sc-bubble-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; border-bottom: 2px solid #1a1a1a; padding-bottom: .5rem; }
  .sc-bubble-title { font-family: "JetBrains Mono", monospace; font-size: .6875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #sc-close { width: 1.75rem; height: 1.75rem; background: #eee9e0; color: #1a1a1a; border-width: 1.5px; }
  #sc-close:hover { background: #1a1a1a; color: #ffffff; }
  #sc-close .material-symbols-outlined { font-size: 1.125rem; }
  #sc-input { width: 100%; box-sizing: border-box; resize: vertical; min-height: 5rem; border: 2px solid #1a1a1a; padding: .5rem .625rem; font-family: "Inter", sans-serif; font-size: .875rem; line-height: 1.375rem; color: #1a1a1a; background: #f5f0e8; }
  #sc-input:focus { outline: 3px solid #0055ff; outline-offset: -3px; }
  .sc-bubble-actions { display: flex; align-items: center; gap: .5rem; }
  .sc-hint { flex: 1; font-family: "JetBrains Mono", monospace; font-size: .625rem; line-height: .875rem; text-transform: uppercase; letter-spacing: .04em; color: rgba(26,26,26,.6); }
  #sc-save { width: 2.25rem; height: 2.25rem; background: #1a1a1a; color: #ffffff; }
  #sc-save:hover { background: #0055ff; }
  #sc-save .material-symbols-outlined { font-size: 1.25rem; }
  #sc-delete { width: 2.25rem; height: 2.25rem; background: #e63b2e; color: #ffffff; }
  #sc-delete:hover { background: #1a1a1a; }
  #sc-toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); z-index: 70; max-width: calc(100vw - 2rem); background: #1a1a1a; color: #ffffff; border-left: 6px solid #ffcc00; padding: .625rem 1rem; font-family: "JetBrains Mono", monospace; font-size: .75rem; font-weight: 500; }
  @media print { header, aside, [data-copy], #sc-widget, #sc-bubble, #sc-toast, #sc-markers { display: none !important; } .lg\:col-span-3 { display: none !important; } .lg\:col-span-9 { grid-column: span 12 / span 12 !important; } }
</style>
<script>
  // 1. Indeks dokumentu + naglowki sekcji (kolorowy kwadrat, numer, linia) - budowane z sekcji.
  const ACCENTS = ['#ffcc00', '#0055ff', '#e63b2e'];
  const sections = Array.from(document.querySelectorAll('#spec-content section[id]'));
  const toc = document.getElementById('toc-nav');
  sections.forEach((section, index) => {
    const h2 = section.querySelector('h2');
    if (!h2) return;
    // Numeracja zrodla ("1. Tytul") jest usuwana - numer generuje szablon, zeby nie bylo "01. 1. Tytul".
    const rawTitle = h2.textContent;
    const label = rawTitle.replace(/^\s*\d+\s*[.)]\s*/, '').trim();
    if (label !== rawTitle.trim()) h2.textContent = label;
    const number = String(index + 1).padStart(2, '0') + '.';

    const head = document.createElement('div');
    head.className = 'sec-head';
    const dot = document.createElement('span');
    dot.className = 'sec-dot';
    dot.style.background = ACCENTS[index % ACCENTS.length];
    const num = document.createElement('span');
    num.className = 'sec-num';
    num.textContent = number;

    h2.parentNode.insertBefore(head, h2);
    head.appendChild(dot);
    head.appendChild(h2);
    h2.insertBefore(num, h2.firstChild);

    toc.insertAdjacentHTML('beforeend',
      '<a class="toc-item" href="#' + section.id + '">' + number + ' ' + label + '</a>');
  });

  // 2. Podswietlanie aktywnej sekcji w indeksie.
  const tocLinks = Array.from(document.querySelectorAll('.toc-item'));
  function highlightCurrent() {
    let current = '';
    sections.forEach(section => {
      if (window.scrollY >= section.offsetTop - 140) current = section.id;
    });
    tocLinks.forEach(link => link.classList.toggle('is-active', link.getAttribute('href') === '#' + current));
  }
  window.addEventListener('scroll', highlightCurrent);
  highlightCurrent();

  // 3. Kopiowanie blokow kodu: <button data-copy="#id-bloku-kodu">Kopiuj</button>
  document.querySelectorAll('[data-copy]').forEach(btn => {
    const original = btn.textContent.trim();
    btn.addEventListener('click', () => {
      const source = document.querySelector(btn.dataset.copy);
      try { navigator.clipboard.writeText(source ? source.innerText : ''); } catch (error) { /* brak dostepu do schowka */ }
      btn.textContent = 'Skopiowano!';
      setTimeout(() => { btn.textContent = original; }, 2000);
    });
  });

  // 4. Licznik listy kontrolnej (elementy z klasa .check-item).
  const checkboxes = document.querySelectorAll('.check-item');
  const counter = document.getElementById('checklist-counter');
  if (checkboxes.length && counter) {
    const updateChecklist = () => {
      const checked = Array.from(checkboxes).filter(box => box.checked).length;
      counter.textContent = 'Status: ' + checked + ' / ' + checkboxes.length + ' (' + Math.round((checked / checkboxes.length) * 100) + '%)';
    };
    checkboxes.forEach(box => box.addEventListener('change', updateChecklist));
    updateChecklist();
  }

  // 5. Komentarze do specyfikacji - tryb staly: klik w dowolny element dokumentu otwiera dymek.
  // Zapis w localStorage (klucz per plik) - komentarze nie wchodza do pliku HTML.
  // Klik na licznik kopiuje caly zestaw jako JSON (z kontekstem: sekcja, selektor, cytat).
  (function () {
    const markers = document.getElementById('sc-markers');
    const widget = document.getElementById('sc-widget');
    if (!widget || !markers) return;

    const countBtn = document.getElementById('sc-count');
    const bubble = document.getElementById('sc-bubble');
    const input = document.getElementById('sc-input');
    const saveBtn = document.getElementById('sc-save');
    const deleteBtn = document.getElementById('sc-delete');
    const closeBtn = document.getElementById('sc-close');
    const toast = document.getElementById('sc-toast');

    const STORAGE_KEY = 'sw-spec-comments:' + location.pathname;
    const CONTENT = document.getElementById('spec-content');
    let comments = load();
    let anchor = null;
    let markerEls = [];
    let toastTimer = null;

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(raw) ? raw : [];
      } catch (error) {
        return [];
      }
    }

    function store() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
      } catch (error) {
        // np. zablokowany localStorage na file:// - komentarze zostaja tylko w tej sesji
      }
      render();
    }

    function plural(count) {
      if (count === 1) return 'komentarz';
      const last = count % 10;
      const teens = count % 100;
      return last >= 2 && last <= 4 && (teens < 10 || teens >= 20) ? 'komentarze' : 'komentarzy';
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.hidden = true; }, 2600);
    }

    function cssPath(element) {
      const parts = [];
      let node = element;
      while (node && node !== document.body) {
        if (node.id) {
          parts.unshift(node.tagName.toLowerCase() + '#' + node.id);
          break;
        }
        const parent = node.parentElement;
        const index = parent ? Array.prototype.indexOf.call(parent.children, node) + 1 : 1;
        parts.unshift(node.tagName.toLowerCase() + ':nth-child(' + index + ')');
        node = parent;
      }
      return parts.join(' > ');
    }

    function describe(element) {
      const section = element.closest('section[id]');
      const heading = section ? section.querySelector('h2') : null;
      const text = (element.innerText || element.textContent || '').replace(/\s+/g, ' ').trim();
      return {
        sectionId: section ? section.id : null,
        sectionTitle: heading ? heading.textContent.replace(/^\s*\d+\.\s*/, '').trim() : null,
        selector: cssPath(element),
        tag: element.tagName.toLowerCase(),
        text: text.slice(0, 240)
      };
    }

    function findBySelector(selector) {
      try { return document.querySelector(selector); } catch (error) { return null; }
    }

    // Indykatory w ukladzie dokumentu (absolute) - przewijanie nie wymaga przeliczania pozycji.
    function positionMarkers() {
      markerEls.forEach(function (marker) {
        const target = findBySelector(marker.entry.selector);
        if (!target) { marker.button.hidden = true; return; }
        marker.button.hidden = false;
        const rect = target.getBoundingClientRect();
        marker.button.style.top = (rect.top + (window.scrollY || 0) - 10) + 'px';
        marker.button.style.left = Math.max(0, rect.left + (window.scrollX || 0) + rect.width - 10) + 'px';
      });
    }

    function render() {
      countBtn.hidden = comments.length === 0;
      countBtn.innerHTML = '<span class="material-symbols-outlined">forum</span><span>' + comments.length + '</span>';
      countBtn.title = comments.length + ' ' + plural(comments.length) + ' — kliknij, aby skopiować JSON do schowka';

      markers.innerHTML = '';
      markerEls = comments.map(function (entry) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'sc-marker';
        button.title = 'Komentarz — kliknij, aby edytować lub usunąć';
        button.innerHTML = '<span class="material-symbols-outlined">chat_bubble</span>';
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          const target = findBySelector(entry.selector);
          if (target) openFor(target);
          else showToast('Nie znaleziono elementu dla tego komentarza');
        });
        markers.appendChild(button);
        return { button: button, entry: entry };
      });
      positionMarkers();
    }

    function openFor(element) {
      anchor = describe(element);
      const existing = comments.find(function (entry) { return entry.selector === anchor.selector; });
      input.value = existing ? existing.comment : '';
      deleteBtn.hidden = !existing;
      bubble.hidden = false;

      const rect = element.getBoundingClientRect();
      const box = bubble.getBoundingClientRect();
      bubble.style.left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - box.width - 8)) + 'px';
      bubble.style.top = (rect.bottom + box.height + 16 > window.innerHeight
        ? Math.max(8, rect.top - box.height - 8)
        : rect.bottom + 8) + 'px';
      input.focus();
    }

    function close() {
      bubble.hidden = true;
      anchor = null;
    }

    function save() {
      if (!anchor) return;
      const text = input.value.trim();
      if (!text) { close(); return; }
      const existing = comments.find(function (entry) { return entry.selector === anchor.selector; });
      const stamp = new Date().toISOString();
      if (existing) {
        existing.comment = text;
        existing.updatedAt = stamp;
      } else {
        comments.push(Object.assign({ id: 'c' + Date.now().toString(36), comment: text, createdAt: stamp }, anchor));
      }
      store();
      close();
      showToast('Komentarz zapisany (' + comments.length + ')');
    }

    function remove() {
      if (!anchor) return;
      comments = comments.filter(function (entry) { return entry.selector !== anchor.selector; });
      store();
      close();
      showToast('Komentarz usunięty (' + comments.length + ')');
    }

    function fallbackCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (error) { copied = false; }
      area.remove();
      return copied;
    }

    function copyAll() {
      if (!comments.length) return;
      const sourceLink = document.querySelector('a[href$=".md"]');
      const payload = {
        spec: document.title,
        source: sourceLink ? sourceLink.getAttribute('href') : null,
        exportedAt: new Date().toISOString(),
        count: comments.length,
        comments: comments
      };
      const json = JSON.stringify(payload, null, 2);
      const done = function (copied) {
        showToast(copied
          ? 'Skopiowano do schowka: ' + comments.length + ' ' + plural(comments.length) + ' (JSON)'
          : 'Nie udało się skopiować — sprawdź uprawnienia schowka');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(function () { done(true); }, function () { done(fallbackCopy(json)); });
      } else {
        done(fallbackCopy(json));
      }
    }

    // Tryb komentarza jest staly - klik w tresc dokumentu otwiera dymek.
    // Wyjatki: linki, przyciski i pola formularza dzialaja normalnie; zaznaczanie tekstu nie otwiera dymku.
    document.addEventListener('click', function (event) {
      const target = event.target;
      if (!CONTENT || target.closest('#sc-widget, #sc-bubble, #sc-markers, #sc-toast')) return;
      if (target.closest('a[href], button, input, label, select, textarea')) return;
      if (window.getSelection && window.getSelection().toString()) return;
      const element = target.closest('#spec-content *');
      if (!element) return;
      event.preventDefault();
      event.stopPropagation();
      openFor(element);
    }, true);

    countBtn.addEventListener('click', copyAll);
    saveBtn.addEventListener('click', save);
    deleteBtn.addEventListener('click', remove);
    closeBtn.addEventListener('click', close);
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { close(); return; }
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); save(); }
    });
    window.addEventListener('resize', positionMarkers);
    window.addEventListener('load', positionMarkers);

    render();
    if (!comments.length) showToast('Kliknij dowolny element dokumentu, aby dodać komentarz');
  }());
</script>
</body>
</html>
